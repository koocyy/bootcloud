<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <title>(>^_^)> BootCloud <('.'<)</title>
    <style>
      :root { color-scheme: light dark; }
      #full {
        width:100%;
        height:100%;
        display:flex;
        flex-direction:column;
        background-color:#31363F;
      }
      #top {
        width:100%;
        height:200px;
        display:flex;
        flex-direction:row;
        background-color:#31363F;
      }
      #categories {
        margin-top:50px;
        margin-left:100px;
        width:60%;
        height:150px;
        display:flex;
        flex-direction:row;
      }
      .button {
        width:10%;
        height:40px;
      }
      #search {
        width:20%;
        height:40px;
        display:flex;
        flex-direction:row;
      }
    </style>
  </head>
  <body>
    <div class="box" id="full">
      <div class="box" id="top">
        <div class="box" id="categories">
          <button class="button" type="radio">Category #1</button>
          <button class="button" type="radio">Category #2</button>
          <button class="button" type="radio">Category #3</button>
        </div>
        <div class="box" id="search">
          <input type="text">
          <h1 style="font-family: Verdana; font-style: italic;">BootCloud</h1>
        </div>
      </div>
    </div>
  </body>
</html>

server {
    server_name bootcloud.eu www.bootcloud.eu;
    root /srv/bootcloud/site;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bootcloud.eu/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bootcloud.eu/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bootcloud.eu) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name bootcloud.eu www.bootcloud.eu;
    return 404; # managed by Certbot


}
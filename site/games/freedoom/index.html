<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freedoom | BootCloud</title>
    <link href="../../assets/bootcloud-symbol.svg" rel="icon">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root {
        color-scheme: dark;
        --ink: #080616;
        --blue: #2F2FE4;
        --line: #162E93;
        --panel: #1A1953;
        --muted: #a7a9d8;
        --code: "JetBrains Mono", ui-monospace, monospace;
        --body: "Archivo", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; display: flex; flex-direction: column; background: var(--ink); color: #eef7ff; font-family: var(--body); }

      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border-bottom: 2px solid var(--line); }
      header a { color: var(--muted); font: 600 .72rem var(--code); letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
      header a:hover { color: #fff; }
      header h1 { margin: 0; font: 800 1rem var(--body); letter-spacing: .06em; text-transform: uppercase; }

      main { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; }
      .screen { position: relative; width: min(100%, calc((100dvh - 150px) * 4 / 3)); aspect-ratio: 4 / 3; border: 3px solid var(--line); background: #000; box-shadow: 6px 6px 0 0 var(--line); }
      /* the canvas must not have a border or padding, or mouse coordinates will be wrong */
      #canvas { display: block; width: 100%; height: 100%; border: 0; padding: 0; outline: none; image-rendering: pixelated; }

      .overlay { position: absolute; inset: 0; display: grid; place-content: center; gap: 18px; padding: 16px; text-align: center; background: center / cover no-repeat url("../../assets/freedoom.jpg"); }
      .overlay::before { content: ""; position: absolute; inset: 0; background: rgba(8, 6, 22, .55); }
      .overlay > * { position: relative; }
      .overlay[hidden] { display: none; }
      #start { justify-self: center; padding: 14px 28px; border: 3px solid var(--line); background: var(--blue); color: #fff; font: 800 1.2rem var(--body); letter-spacing: .08em; text-transform: uppercase; box-shadow: 4px 4px 0 0 var(--line); cursor: pointer; }
      #start:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 0 var(--line); }
      #start:disabled { cursor: progress; opacity: .8; transform: none; }
      #status { min-height: 1.2em; font: 600 .75rem var(--code); letter-spacing: .04em; }

      footer { padding: 10px 16px; border-top: 2px solid var(--line); color: var(--muted); font: .68rem/1.6 var(--code); text-align: center; }
      footer a { color: var(--muted); }
      kbd { padding: 1px 5px; border: 1px solid var(--line); background: var(--panel); color: #fff; font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <a href="../../#games-browser">&larr; Back to games</a>
      <h1>Freedoom: Phase 1</h1>
    </header>

    <main>
      <div class="screen">
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <div class="overlay" id="overlay">
          <button id="start" type="button">Play</button>
          <p id="status">Download ~31 MB</p>
        </div>
      </div>
    </main>

    <footer>
      <p>
        <kbd>W A S D</kbd> move &middot; <kbd>&larr; &rarr;</kbd> turn &middot; <kbd>Space</kbd> fire &middot; <kbd>E</kbd> use / open &middot; <kbd>Shift</kbd> run &middot; <kbd>Tab</kbd> map &middot; <kbd>Esc</kbd> menu
      </p>
      <p>
        <a href="https://freedoom.github.io/" target="_blank" rel="noopener">Freedoom</a> (<a href="FREEDOOM-COPYING.txt">BSD license</a>, <a href="FREEDOOM-CREDITS.txt">credits</a>)
        &middot; engine: <a href="https://github.com/cloudflare/doom-wasm" target="_blank" rel="noopener">Wasm Doom</a>, a Chocolate Doom port (GNU GPL v2, source on GitHub)
      </p>
    </footer>

    <script>
      const startButton = document.getElementById("start");
      const statusText = document.getElementById("status");
      const overlay = document.getElementById("overlay");
      const canvas = document.getElementById("canvas");
      const args = ["-iwad", "freedoom1.wad", "-window", "-nogui", "-nomusic", "-config", "default.cfg"];

      var Module = {
        noInitialRun: true,
        canvas,
        preRun: () => {
          Module.FS.createPreloadedFile("", "freedoom1.wad", "freedoom1.wad", true, true);
          Module.FS.createPreloadedFile("", "default.cfg", "default.cfg", true, true);
        },
        onRuntimeInitialized: () => {
          overlay.hidden = true;
          canvas.focus();
          callMain(args);
        },
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
        setStatus: (text) => { if (text) statusText.textContent = text; },
        totalDependencies: 0,
        monitorRunDependencies(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          statusText.textContent = left ? `Loading... (${this.totalDependencies - left}/${this.totalDependencies})` : "Starting...";
        },
      };

      canvas.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        alert("Graphics context lost. Reload the page.");
      });

      window.addEventListener("error", () => {
        overlay.hidden = false;
        startButton.hidden = true;
        statusText.textContent = "Something went wrong. Reload the page and try again.";
      });

      startButton.addEventListener("click", () => {
        if (typeof WebAssembly !== "object") {
          statusText.textContent = "Your browser does not support WebAssembly.";
          return;
        }
        startButton.disabled = true;
        statusText.textContent = "Loading...";
        const engine = document.createElement("script");
        engine.src = "websockets-doom.js";
        document.body.append(engine);
      });

      // keep arrow keys and space from scrolling the page while playing
      window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key) && document.activeElement === canvas) {
          event.preventDefault();
        }
      });
      canvas.addEventListener("click", () => canvas.focus());
    </script>
  </body>
</html>
